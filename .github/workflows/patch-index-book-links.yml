name: Apply verified book links to index
on:
  push:
    branches: [seo-auditoria-2026-11]
    paths: [.github/workflows/patch-index-book-links.yml]
permissions:
  contents: write
jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update only four verified links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("index.html")
          source = p.read_bytes()
          original = "202cd57414a9a4fc94802b59fbc481e3fc01b2f0e3e9c245bd6128a5e1cf382b"
          expected = "9489cda7fe4abfb3a4873e16ca730ee56d8f0a541b9bd02e8eeb0d1ccf3a681e"
          digest = hashlib.sha256(source).hexdigest()
          if digest == expected:
              print("Links already updated, nothing to do.")
              raise SystemExit(0)
          if digest != original:
              raise SystemExit("Unexpected index.html SHA256, refusing to modify.")
          changes = [
              (b'href="libros.html" aria-label="Ver ARIS:', b'href="aris-de-la-oscuridad-a-la-libertad.html" aria-label="Ver ARIS:'),
              (b'href="libros.html">Descubrir mi historia', b'href="aris-de-la-oscuridad-a-la-libertad.html">Descubrir mi historia'),
              (b'href="libros.html" aria-label="Ver La vida psicol', b'href="la-vida-psicologica-es-un-sugus.html" aria-label="Ver La vida psicol'),
              (b'href="libros.html">Ver el libro', b'href="la-vida-psicologica-es-un-sugus.html">Ver el libro'),
          ]
          for old, new in changes:
              if source.count(old) != 1:
                  raise SystemExit("Expected exactly one occurrence: " + repr(old))
              source = source.replace(old, new)
          if hashlib.sha256(source).hexdigest() != expected:
              raise SystemExit("Result hash mismatch, refusing to write.")
          p.write_bytes(source)
          print("Updated exactly four links; SHA256 verified.")
          PY
      - name: Commit the verified change to this preview branch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "SEO: link homepage book covers and buttons to detail pages"
          git push origin HEAD:seo-auditoria-2026-11
