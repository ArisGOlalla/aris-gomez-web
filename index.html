<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aris Gómez</title>

<meta name="description" content="Sitio oficial de Aris Gómez. Autora de De la Oscuridad a la Libertad.">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#05010a;
color:white;
overflow-x:hidden;
}

/* NAVBAR */

nav{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:center;
padding:18px 20px;
z-index:1000;

background:rgba(5,1,10,.75);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.06);
}

.nav-links{
display:flex;
gap:14px;
overflow-x:auto;
white-space:nowrap;
scrollbar-width:none;
padding-bottom:5px;
}

.nav-links::-webkit-scrollbar{
display:none;
}

.nav-links a{
text-decoration:none;
color:white;
padding:10px 18px;
border-radius:999px;
font-size:14px;
transition:.3s;

background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.06);
}

.nav-links a:hover{
background:linear-gradient(to right,#d6a3ff,#f3d37b);
color:#05010a;
}

/* HERO */

.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:140px 8% 100px;

background:
radial-gradient(circle at top right, rgba(215,180,255,.18), transparent 30%),
radial-gradient(circle at bottom left, rgba(243,211,123,.14), transparent 30%),
#05010a;
}

.hero-content{
max-width:1100px;
text-align:center;
}

.hero span{
display:block;
font-size:13px;
letter-spacing:4px;
text-transform:uppercase;
color:#d7b46a;
margin-bottom:25px;
}

.hero h1{
font-size:120px;
line-height:.92;
letter-spacing:-5px;
font-weight:300;

background:linear-gradient(to right,#ffffff,#d7b4ff,#f3d37b);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

margin-bottom:35px;
font-family:Georgia, serif;
}

.hero p{
font-size:24px;
line-height:1.8;
max-width:850px;
margin:auto;
color:rgba(255,255,255,.72);
}

/* QUOTE */

.quote{
padding:120px 8%;
text-align:center;

background:
linear-gradient(to bottom,#05010a,#12071b);
}

.quote h2{
font-size:70px;
line-height:1.15;
font-weight:300;
letter-spacing:-3px;
max-width:1000px;
margin:auto;

background:linear-gradient(to right,#f3d37b,#ffffff,#c993ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

font-family:Georgia, serif;
}

.quote p{
margin-top:30px;
font-size:22px;
color:rgba(255,255,255,.6);
}

/* FOOTER */

footer{
padding:60px 20px;
text-align:center;
border-top:1px solid rgba(255,255,255,.06);
}

footer p{
color:rgba(255,255,255,.45);
font-size:14px;
}

/* MOBILE */

@media(max-width:900px){

.hero{
padding-top:170px;
}

.hero h1{
font-size:62px;
letter-spacing:-2px;
}

.hero p{
font-size:18px;
line-height:1.7;
}

.quote h2{
font-size:40px;
letter-spacing:-1px;
}

.quote p{
font-size:18px;
}

.nav-links{
justify-content:flex-start;
width:100%;
padding-left:10px;
}

}

</style>
</head>

</div>

</nav>

<div class="hero-content">

<span>Sitio oficial</span>

<h1>
Aris<br>
Gómez
</h1>

<p>
Autora de “De la Oscuridad a la Libertad”.
Una historia real de resiliencia, reconstrucción
emocional y transformación personal.
</p>

</div>

</section>

<section class="quote">

<h2>
“Transformar la oscuridad
en libertad.”
</h2>

<p>

</p>

</section>

<footer>

<p>

</footer>

</body>
</html>
